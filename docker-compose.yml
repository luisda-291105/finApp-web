# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — finApp-web
#
# Servicios:
#   finapp-web-dev   → Vite dev server con hot-reload  (perfil: dev)
#   finapp-web-prod  → Nginx sirviendo build estático  (perfil: prod)
#
# Uso rápido:
#   Desarrollo : docker compose --profile dev  up --build
#   Producción : docker compose --profile prod up --build -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Desarrollo ───────────────────────────────────────────────────────────
  finapp-web-dev:
    container_name: finapp-web-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev                     # Usa el stage "dev"
    profiles: [dev]
    ports:
      - "${DEV_PORT:-5173}:5173"      # Puerto configurable via .env
    volumes:
      - .:/app                        # Monta el código para hot-reload
      - /app/node_modules             # Preserva node_modules del contenedor
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    restart: unless-stopped

  # ── Producción ───────────────────────────────────────────────────────────
  finapp-web-prod:
    container_name: finapp-web-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod                    # Usa el stage "prod" (builder + nginx)
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    profiles: [prod]
    ports:
      - "${PROD_PORT:-3000}:80"       # Puerto configurable via .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
